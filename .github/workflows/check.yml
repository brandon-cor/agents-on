name: Build and check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check.sh
      - run: bash scripts/check-controls.sh
      - run: bash scripts/check-gui.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Agents-On-macOS
          path: dist/
