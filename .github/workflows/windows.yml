name: Windows build and check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Published version to test on Windows 11 (blank runs the normal build)'
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.release_version == ''
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          foreach ($path in @('windows/install.ps1', 'windows/uninstall.ps1', 'scripts/build-windows.ps1', 'scripts/check-windows-install.ps1', 'scripts/check-windows11-release.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Check real Windows directory-lock retries
        shell: pwsh
        run: ./scripts/check-windows-install.ps1
      - name: Check session logic
        run: dotnet run --project windows/AgentsOn.Tests/AgentsOn.Tests.csproj --configuration Release
      - name: Build Windows x64 package
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Runtime win-x64
      - name: Capture light and dark Windows controls
        shell: pwsh
        run: dotnet run --project tools/WindowsUiPreview --configuration Release -- dist/windows-preview
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Agents-On-Windows-UI
          path: dist/windows-preview
          if-no-files-found: error
      - name: Check native Windows app and package
        shell: pwsh
        run: |
          $archive = Join-Path $PWD 'dist/Agents-On-Windows-win-x64.zip'
          ./windows/install.ps1 -ArchivePath $archive -CheckOnly
          $smoke = Join-Path $env:RUNNER_TEMP 'agents-on-smoke'
          Expand-Archive -LiteralPath $archive -DestinationPath $smoke
          $binary = Join-Path $smoke 'Agents-On-Windows/AgentsOn.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'agents-on-selftest.out'
          $stderr = Join-Path $env:RUNNER_TEMP 'agents-on-selftest.err'
          $app = Start-Process -FilePath $binary -ArgumentList '--self-test' -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $app.WaitForExit(60000)) { throw 'Native self-test timed out.' }
          Get-Content -LiteralPath $stdout, $stderr -ErrorAction SilentlyContinue
          if ($app.ExitCode -ne 0) { throw "Native self-test failed ($($app.ExitCode))." }
      - name: Install, upgrade, and uninstall without elevation
        shell: pwsh
        run: |
          $archive = Join-Path $PWD 'dist/Agents-On-Windows-win-x64.zip'
          $installed = Join-Path $env:LOCALAPPDATA 'Programs/Agents On/AgentsOn.exe'
          $uninstall = Join-Path $env:LOCALAPPDATA 'Programs/Agents On/uninstall.ps1'
          try {
            ./windows/install.ps1 -ArchivePath $archive -DesktopShortcut
            if (-not (Test-Path -LiteralPath $installed)) { throw 'Installed app is missing.' }
            $startup = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'Agents On').'Agents On'
            if ($startup -ne ('"' + $installed + '"')) { throw 'Login startup points to the wrong executable.' }
            # A different standard user must not acquire a second machine-wide owner.
            # The previous per-SID mutex would let this probe acquire its own lock.
            $probeName = 'ao' + [guid]::NewGuid().ToString('N').Substring(0, 12)
            $probeFolder = Join-Path $env:PUBLIC ('agents-on-cross-user-' + [guid]::NewGuid().ToString('N'))
            $probeUser = $null
            $probeProcess = $null
            $startedSecondaryLogon = $false
            try {
              $password = 'Aa1!' + [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(32))
              $securePassword = ConvertTo-SecureString -String $password -AsPlainText -Force
              $password = $null
              $probeUser = New-LocalUser -Name $probeName -Password $securePassword -AccountNeverExpires -PasswordNeverExpires -UserMayNotChangePassword
              $usersGroup = Get-LocalGroup -SID 'S-1-5-32-545'
              if (-not (Get-LocalGroupMember -Group $usersGroup | Where-Object { $_.SID -eq $probeUser.SID })) {
                Add-LocalGroupMember -Group $usersGroup -Member $probeUser
              }
              $probeTemp = Join-Path $probeFolder 'temp'
              $probeBundle = Join-Path $probeFolder 'bundle'
              $probeData = Join-Path $probeFolder 'appdata'
              New-Item -ItemType Directory -Path $probeFolder, $probeTemp, $probeBundle, $probeData -Force | Out-Null
              $probeBinary = Join-Path $probeFolder 'AgentsOn.exe'
              Copy-Item -LiteralPath $installed -Destination $probeBinary
              $probeAcl = '*' + $probeUser.SID.Value + ':(OI)(CI)M'
              & icacls.exe $probeFolder /grant $probeAcl /T /C | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'Could not grant the disposable user access to its probe folder.' }
              if ((Get-Service -Name seclogon).Status -ne 'Running') {
                Start-Service -Name seclogon
                $startedSecondaryLogon = $true
              }
              $credential = [pscredential]::new(($env:COMPUTERNAME + [IO.Path]::DirectorySeparatorChar + $probeName), $securePassword)
              $probeEnvironment = @{ TEMP = $probeTemp; TMP = $probeTemp; DOTNET_BUNDLE_EXTRACT_BASE_DIR = $probeBundle; LOCALAPPDATA = $probeData }
              $probeProcess = Start-Process -FilePath $probeBinary -Credential $credential -LoadUserProfile -WorkingDirectory $probeFolder -Environment $probeEnvironment -ArgumentList '--self-test-lock' -PassThru
              if (-not $probeProcess.WaitForExit(30000)) { throw 'Cross-account ownership probe timed out.' }
              if ($probeProcess.ExitCode -ne 0) { throw "A different Windows account was not blocked from owning power settings (exit $($probeProcess.ExitCode))." }
              Write-Host 'A different standard Windows user was blocked by the machine-wide power owner.'
            } finally {
              $cleanupErrors = @()
              try {
                if ($null -ne $probeProcess) {
                  if (-not $probeProcess.HasExited) { $probeProcess.Kill($true); $probeProcess.WaitForExit() }
                  $probeProcess.Dispose()
                }
              } catch { $cleanupErrors += "Probe process cleanup failed: $($_.Exception.Message)" }
              try {
                if ($null -ne $probeUser) { Remove-LocalUser -SID $probeUser.SID -ErrorAction Stop }
              } catch { $cleanupErrors += "Disposable user cleanup failed: $($_.Exception.Message)" }
              try {
                if (Test-Path -LiteralPath $probeFolder) { Remove-Item -LiteralPath $probeFolder -Recurse -Force -ErrorAction Stop }
              } catch { $cleanupErrors += "Probe folder cleanup failed: $($_.Exception.Message)" }
              try {
                if ($startedSecondaryLogon -and (Get-Service -Name seclogon).CanStop) { Stop-Service -Name seclogon -ErrorAction Stop }
              } catch { Write-Warning 'Secondary Logon is not stoppable on this disposable hosted runner; the VM will be discarded after the job.' }
              if ($cleanupErrors.Count -gt 0) { throw ($cleanupErrors -join '; ') }
            }
            ./windows/install.ps1 -ArchivePath $archive -SkipStartup
            if (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'Agents On' -ErrorAction SilentlyContinue) { throw 'SkipStartup did not disable login startup.' }
            & $uninstall
            if (Test-Path -LiteralPath $installed) { throw 'Uninstall left the executable behind.' }
            if (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'Agents On' -ErrorAction SilentlyContinue) { throw 'Uninstall left the login entry behind.' }
          } finally {
            if (Test-Path -LiteralPath $uninstall) { & $uninstall }
          }
      - name: Build Windows ARM64 package
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Runtime win-arm64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Agents-On-Windows
          path: |
            dist/Agents-On-Windows-*.zip
            dist/Agents-On-Windows-*.zip.sha256
          if-no-files-found: error
  windows11-release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
    runs-on: windows-11-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-arm64, win-x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test the published release on Windows 11
        shell: pwsh
        env:
          AGENTS_RELEASE_VERSION: ${{ inputs.release_version }}
          AGENTS_RUNTIME: ${{ matrix.runtime }}
        run: ./scripts/check-windows11-release.ps1 -Version $env:AGENTS_RELEASE_VERSION -Runtime $env:AGENTS_RUNTIME
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: v${{ inputs.release_version }}
          path: release-source
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Capture the release source controls on Windows 11
        shell: pwsh
        env:
          AGENTS_RUNTIME: ${{ matrix.runtime }}
        run: |
          $sourceCommit = git -C release-source rev-parse HEAD
          if (-not (Test-Path release-source/tools/WindowsUiPreview/WindowsUiPreview.csproj)) {
            Write-Host 'This older release does not include the optional UI capture helper.'
            exit 0
          }
          $previousCommit = $env:GITHUB_SHA
          try {
            $env:GITHUB_SHA = $sourceCommit
            dotnet run --project release-source/tools/WindowsUiPreview --configuration Release -- "dist/windows11-$env:AGENTS_RUNTIME/ui"
            if ($LASTEXITCODE -ne 0) { throw 'Windows 11 UI capture failed.' }
          } finally { $env:GITHUB_SHA = $previousCommit }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Agents-On-Windows11-${{ matrix.runtime }}
          path: dist/windows11-${{ matrix.runtime }}
          if-no-files-found: error
